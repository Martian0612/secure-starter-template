name: Secret Scan

on: [push, pull_request]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install and Run Gitleaks CLI
        run: |
          set -e
          mkdir -p ./bin
          curl -sSfL "https://github.com{GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz -C ./bin gitleaks
          ./bin/gitleaks detect --source=. --redact --verbose --config=.gitleaks.toml
          rm -rf ./bin gitleaks.tar.gz
