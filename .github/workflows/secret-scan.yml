name: Secret Scan
on: [push, pull_request]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Gitleaks CLI
        run: |
          set -e
          wget -q https://github.com -O gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x ./gitleaks
          ./gitleaks git --redact --verbose --config=.gitleaks.toml
          rm -f gitleaks gitleaks.tar.gz
