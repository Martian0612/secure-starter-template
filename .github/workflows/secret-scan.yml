name: Secret Scan

on: [push, pull_request]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install and Run Gitleaks CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./bin
          gh release download --repo gitleaks/gitleaks --pattern "*_linux_x64.tar.gz" --dir ./bin
          tar -xzf ./bin/*_linux_x64.tar.gz -C ./bin gitleaks
          ./bin/gitleaks detect --source=. --redact --verbose --config=.gitleaks.toml
          rm -rf ./bin
